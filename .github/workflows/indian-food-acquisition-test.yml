name: "Indian Food Image Acquisition Test"

on:
  workflow_dispatch:
    inputs: {}
  push:
    branches:
      - arena/9235252f-nutricare
    paths:
      - '.github/workflows/indian-food-acquisition-test.yml'

permissions:
  contents: read

jobs:
  connectivity-and-acquisition:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Probe Wikimedia host reachability (socket + TLS)
        id: probe
        run: |
          python - <<'PY'
          import json, socket, ssl, time
          from datetime import datetime, timezone
          from pathlib import Path

          hosts = ["commons.wikimedia.org", "upload.wikimedia.org"]
          results = []
          for host in hosts:
              started = time.time()
              try:
                  context = ssl.create_default_context()
                  with socket.create_connection((host, 443), timeout=10) as sock:
                      with context.wrap_socket(sock, server_hostname=host) as tls:
                          peer = tls.getpeercert().get("subject", [])
                  results.append({
                      "host": host,
                      "reachable": True,
                      "tls_subject": str(peer)[:120],
                      "elapsed_s": round(time.time() - started, 3),
                  })
              except Exception as exc:
                  results.append({
                      "host": host,
                      "reachable": False,
                      "error": f"{type(exc).__name__}: {exc}"[:200],
                      "elapsed_s": round(time.time() - started, 3),
                  })

          out_dir = Path("data/v4/acquisition")
          out_dir.mkdir(parents=True, exist_ok=True)
          (out_dir / "source_probe.json").write_text(
              json.dumps({"probed_at": datetime.now(timezone.utc).isoformat(), "hosts": results}, indent=2) + "\n"
          )

          for r in results:
              status = "REACHABLE" if r["reachable"] else "UNREACHABLE"
              detail = r.get("error") or r.get("tls_subject", "")
              print(f"  {status:12s} {r['host']:32s} {detail[:80]}")

          all_ok = all(r["reachable"] for r in results)
          print(f"\n{'PASS' if all_ok else 'FAIL'}: Wikimedia host reachability")
          if not all_ok:
              print("WARNING: Not all Wikimedia hosts reachable. Image download may fail.")
          PY

      - name: Verify Wikimedia Commons metadata API returns valid JSON
        id: metadata-check
        run: |
          python - <<'PY'
          import json, urllib.request
          from urllib.parse import quote
          from datetime import datetime, timezone
          from pathlib import Path

          # Seed record: File:Biryani and tempting.jpg (pageid 201150503)
          title = "File:Biryani and tempting.jpg"
          api_url = (
              "https://commons.wikimedia.org/w/api.php"
              "?action=query"
              "&prop=imageinfo"
              f"&titles={quote(title)}"
              "&iiprop=url|size|sha1|mime|extmetadata"
              "&format=json"
          )

          req = urllib.request.Request(
              api_url,
              headers={
                  "User-Agent": "NutriCare-V2-dataset/1.0 (research; contact: repo owner)",
                  "Accept": "application/json",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              body = response.read()
          data = json.loads(body)

          pages = data.get("query", {}).get("pages", {})
          if not pages:
              raise SystemExit("FAIL: metadata API returned no 'pages'")

          page = next(iter(pages.values()))
          if page.get("missing"):
              raise SystemExit(f"FAIL: file '{title}' is missing on Commons")

          ii = page.get("imageinfo", [])
          if not ii:
              raise SystemExit(f"FAIL: file '{title}' has no imageinfo")

          info = ii[0]
          required = ["size", "width", "height", "sha1", "url", "mime"]
          missing = [k for k in required if k not in info]
          if missing:
              raise SystemExit(f"FAIL: imageinfo missing fields: {missing}")

          ext = info.get("extmetadata", {})
          licence = ext.get("LicenseShortName", {}).get("value", "")
          artist = ext.get("Artist", {}).get("value", "")

          record = {
              "pageid": page.get("pageid"),
              "title": page.get("title"),
              "url": info.get("url"),
              "descriptionurl": info.get("descriptionurl"),
              "size": info.get("size"),
              "width": info.get("width"),
              "height": info.get("height"),
              "sha1": info.get("sha1"),
              "mime": info.get("mime"),
              "licence": licence,
              "artist": artist,
          }

          out_dir = Path("data/v4/acquisition")
          out_dir.mkdir(parents=True, exist_ok=True)
          (out_dir / "metadata_check.json").write_text(
              json.dumps({"checked_at": datetime.now(timezone.utc).isoformat(), "record": record}, indent=2) + "\n"
          )

          print(f"PASS: metadata API returned valid JSON for '{title}'")
          print(f"  pageid={record['pageid']} size={record['size']} "
                f"{record['width']}x{record['height']} "
              f"licence={record['licence']} artist={record['artist']}")
          PY

      - name: Run batch acquisition (acquire_v2.py pipeline)
        id: acquire
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          import urllib.error
          from pathlib import Path
          from training.acquire_v2 import load_seeds, run_acquisition_attempt

          def verbose_opener(url, timeout):
              """Custom opener that prints HTTP response details for diagnosis.
              Handles HTTP 429 (Too Many Requests) by respecting Retry-After
                  and retrying once — directly addressing Wikimedia rate-limiting.
              Adds a small inter-request pause to pace downloads from shared CI
              runner IPs."""
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "NutriCare-V2-dataset/1.0 (research; contact: repo owner)",
                      "Accept": "image/*",
                  },
              )
              # 15s pacing between downloads: proven on the single-image run
              # to avoid Wikimedia rate limiting from shared CI runner IPs.
              # The 429 retry below handles any remaining rate limiting.
              time.sleep(15)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      body = response.read()
                      print(f"  HTTP {response.status} {response.geturl()} size={len(body)}")
                      return body
              except urllib.error.HTTPError as e:
                  body = e.read()[:500]
                  print(f"  HTTP ERROR {e.code} {e.geturl()} body={body!r}")
                  if e.code == 429:
                      retry_after = e.headers.get("Retry-After")
                      delay = int(retry_after) if retry_after and retry_after.isdigit() else 30
                      print(f"  Rate limited (429). Retrying after {delay}s...")
                      time.sleep(delay)
                      try:
                          with urllib.request.urlopen(req, timeout=timeout) as response:
                              body = response.read()
                              print(f"  HTTP {response.status} {response.geturl()} size={len(body)} (retry)")
                              return body
                      except urllib.error.HTTPError as e2:
                          body2 = e2.read()[:500]
                          print(f"  HTTP ERROR {e2.code} {e2.geturl()} body={body2!r} (retry)")
                          raise
                  raise
              except Exception as e:
                  print(f"  FETCH ERROR {type(e).__name__}: {e}")
                  raise

          seeds_path = Path("data/v4/acquisition/commons_seeds.json")
          out_dir = Path("data/v4/acquisition")
          images_dir = Path("data/v4/images")

          # All seed classes, limit 1 per class (7 images total)
          # One verified image per class to establish the pipeline across all classes.
          seeds = load_seeds(seeds_path)
          target_classes = ["biryani", "dosa", "gulab_jamun", "idli", "jalebi", "naan", "samosa"]
          filtered = [s for s in seeds if s.get("class") in target_classes]
          filtered_path = Path("data/v4/acquisition/batch_seeds.json")
          filtered_path.write_text(json.dumps({"records": filtered}, indent=1))

          report = run_acquisition_attempt(
              filtered_path,
              out_dir=out_dir,
              images_dir=images_dir,
              download=True,
              limit_per_class=1,
              opener=verbose_opener,
          )
          print(json.dumps(report.get("totals", {}), indent=2))
          print(json.dumps(report.get("per_class", {}), indent=2))
          PY

      - name: Verify batch acquisition downloaded valid images
        id: verify-acquisition
        run: |
          python - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          from PIL import Image

          report_path = Path("data/v4/acquisition/acquisition_attempt.json")
          if not report_path.exists():
              print("FAIL: acquisition_attempt.json not found")
              sys.exit(1)

          report = json.loads(report_path.read_text())
          totals = report.get("totals", {})

          print(f"  FULL REPORT: {json.dumps(report, indent=2)}")

          # Write to GITHUB_STEP_SUMMARY so it renders on the run page
          summary_path = Path(os.environ.get("GITHUB_STEP_SUMMARY", "/tmp/summary.md"))
          summary_path.parent.mkdir(parents=True, exist_ok=True)
          summary_lines = [
              "## Acquisition Diagnostic Summary",
              f"- images_discovered: {totals.get('images_discovered', 0)}",
              f"- images_downloaded: {totals.get('images_downloaded', 0)}",
              f"- passing_integrity: {totals.get('passing_integrity', 0)}",
              "",
          ]
          for row in report.get("rows", []):
              status = row.get("acquire_status", "unknown")
              pageid = row.get("pageid", "?")
              class_slug = row.get("class", "?")
              summary_lines.append(f"- Row pageid={pageid} class={class_slug}: status={status}")
              if status == "failed":
                  summary_lines.append(f"  - failure_reason: {row.get('failure_reason', 'unknown')}")
              elif status == "downloaded":
                  dl = row.get("download", {})
                  summary_lines.append(f"  - bytes: {dl.get('bytes')}, sha256: {dl.get('sha256')}")
                  summary_lines.append(f"  - width: {dl.get('width')}, height: {dl.get('height')}")
          summary_path.write_text("\n".join(summary_lines) + "\n")

          discovered = totals.get("images_discovered", 0)
          downloaded = totals.get("images_downloaded", 0)
          integrity = totals.get("passing_integrity", 0)

          print(f"  images_discovered: {discovered}")
          print(f"  images_downloaded: {downloaded}")
          print(f"  passing_integrity: {integrity}")

          rows = report.get("rows", [])

          # Print per-row status for diagnosis
          for row in rows:
              status = row.get("acquire_status", "unknown")
              pageid = row.get("pageid", "?")
              class_slug = row.get("class", "?")
              if status == "failed":
                  reason = row.get("failure_reason", "unknown")
                  print(f"  FAILED ROW: pageid={pageid} class={class_slug}, reason={reason}")
                  print(f"::error::Acquisition failed for pageid={pageid} class={class_slug}: {reason}")
              elif status == "downloaded":
                  dl = row.get("download", {})
                  print(f"  DOWNLOADED ROW: pageid={pageid} class={class_slug}, bytes={dl.get('bytes')}, sha256={dl.get('sha256')}")
              else:
                  print(f"  SKIPPED ROW: pageid={pageid} class={class_slug}, status={status}")

          if downloaded == 0:
              print("FAIL: no images were downloaded")
              print("::error::No images were downloaded from Wikimedia Commons")
              sys.exit(1)

          # Verify each downloaded row has full provenance and valid image bytes
          downloaded_rows = [r for r in rows if r.get("acquire_status") == "downloaded"]
          all_ok = True
          for row in downloaded_rows:
              pageid = row.get("pageid")
              class_slug = row.get("class", "unknown")
              if pageid is None:
                  print(f"FAIL: row missing pageid: {row}")
                  all_ok = False
                  continue

              required = ["source_url", "licence", "author", "declared_sha1",
                          "declared_bytes", "declared_width", "declared_height",
                          "rights_tier", "human_review_status", "download"]
              missing = [k for k in required if k not in row]
              if missing:
                  print(f"FAIL: pageid={pageid} row missing provenance fields: {missing}")
                  all_ok = False
                  continue

              dl = row.get("download", {})
              if not dl.get("ok"):
                  print(f"FAIL: pageid={pageid} download not ok: {dl.get('reason')}")
                  all_ok = False
                  continue

              integrity_block = row.get("integrity", {})
              if integrity_block.get("bytes") != row.get("declared_bytes"):
                  print(f"FAIL: pageid={pageid} bytes {integrity_block.get('bytes')} != declared {row.get('declared_bytes')}")
                  all_ok = False
              if integrity_block.get("width") != row.get("declared_width"):
                  print(f"FAIL: pageid={pageid} width {integrity_block.get('width')} != declared {row.get('declared_width')}")
                  all_ok = False
              if integrity_block.get("height") != row.get("declared_height"):
                  print(f"FAIL: pageid={pageid} height {integrity_block.get('height')} != declared {row.get('declared_height')}")
                  all_ok = False

              # Verify SHA256 from the downloaded file
              image_path = Path("data/v4/images") / class_slug / f"{pageid}.jpg"
              if not image_path.exists():
                  print(f"FAIL: pageid={pageid} image file not found at {image_path}")
                  all_ok = False
                  continue

              sha256 = hashlib.sha256(image_path.read_bytes()).hexdigest()
              recorded_sha256 = dl.get("sha256")
              if sha256 != recorded_sha256:
                  print(f"FAIL: pageid={pageid} SHA256 mismatch: computed {sha256}, recorded {recorded_sha256}")
                  all_ok = False

              # Verify the file opens as a valid image with Pillow
              try:
                  with Image.open(image_path) as img:
                      img.verify()
                  with Image.open(image_path) as img:
                      width, height = img.size
                      fmt = img.format
              except Exception as exc:
                  print(f"FAIL: pageid={pageid} could not open image with Pillow: {type(exc).__name__}: {exc}")
                  all_ok = False
                  continue

              declared_w = row.get("declared_width")
              declared_h = row.get("declared_height")
              if declared_w is not None and width != declared_w:
                  print(f"FAIL: pageid={pageid} Pillow width {width} != declared width {declared_w}")
                  all_ok = False
              if declared_h is not None and height != declared_h:
                  print(f"FAIL: pageid={pageid} Pillow height {height} != declared height {declared_h}")
                  all_ok = False

              print(f"  VERIFIED: pageid={pageid} class={class_slug} sha256={sha256} "
                    f"dims={width}x{height} fmt={fmt} licence={row['licence'].get('short_name')}")

          if not all_ok:
              print("FAIL: one or more downloaded images failed verification")
              print("::error::Batch acquisition verification found invalid images")
              sys.exit(1)

          print(f"PASS: {len(downloaded_rows)} valid image(s) downloaded with full provenance")
          for row in downloaded_rows:
              pageid = row.get("pageid")
              class_slug = row.get("class", "unknown")
              print(f"  pageid={pageid} class={class_slug} source_url={row['source_url']}")
              print(f"    licence={row['licence'].get('short_name')} author={row['author']}")
              print(f"    rights_tier={row['rights_tier']} review={row['human_review_status']}")
          PY

      - name: Upload acquisition report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acquisition-report
          path: data/v4/acquisition/acquisition_attempt.json
          retention-days: 90

      - name: Upload metadata check artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-check
          path: data/v4/acquisition/metadata_check.json
          retention-days: 90

      - name: Upload downloaded image artifact (all downloaded images)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-images
          path: data/v4/images/**/*.jpg
          retention-days: 90